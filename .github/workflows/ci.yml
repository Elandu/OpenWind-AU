name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lockfile:
    name: Verify dependency lock
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify lockfile matches project metadata
        run: uv lock --check

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Install the locked development environment
        run: uv sync --locked --extra dev --python 3.12

      - name: Test the locked dependency graph
        run: uv run --locked --no-sync pytest

  contracts:
    name: Validate repository contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON contract files
        run: |
          python -m json.tool data/validation/golden-case.schema.json > /dev/null
          python -m json.tool data/production/manifest.schema.json > /dev/null
          python -m json.tool data/production/manifest.example.json > /dev/null

      - name: Check container configuration
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f .env.example
          grep -q "^USER openwind$" Dockerfile
          grep -q "/health/live" Dockerfile

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke-test console entry point
        run: openwind-au --help

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  container:
    name: Build production container
    needs: [lockfile, test, contracts]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --pull -t openwind-au:ci .

      - name: Smoke-test image entry point
        run: docker run --rm openwind-au:ci openwind-au --help

  package:
    name: Build consumer artifacts
    needs: [lockfile, test, contracts]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel contents and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("openwind_au-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "openwind_au/cache_io.py",
              "openwind_au/data/shielding_multipliers.json",
              "openwind_au/data/terrain_height_multipliers.json",
              "openwind_au/errors.py",
              "openwind_au/main.py",
              "openwind_au/report_lineage.py",
              "openwind_au/result_integrity.py",
              "openwind_au/standard_lookup_tables.py",
          }
          missing = required - names
          assert not missing, f"Wheel is missing required runtime files: {sorted(missing)}"
          PY

      - name: Smoke-test installed wheel
        run: |
          python -m pip install --no-deps --target /tmp/openwind-wheel-smoke dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/openwind-wheel-smoke python - <<'PY'
          from importlib.metadata import distribution, version

          from openwind_au import __version__
          from openwind_au.standard_lookup_tables import (
              MS_DATA_FILE,
              MZCAT_DATA_FILE,
              load_packaged_lookup_data,
          )

          assert version("openwind-au") == __version__
          console_scripts = {
              entry.name: entry.value
              for entry in distribution("openwind-au").entry_points
              if entry.group == "console_scripts"
          }
          assert console_scripts["openwind-au"] == "openwind_au.main:main"
          assert console_scripts["openwind-au-mcp"] == "openwind_au.mcp_server:main"
          for filename in (MZCAT_DATA_FILE, MS_DATA_FILE):
              assert load_packaged_lookup_data(filename)["schema_version"] == 1
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: openwind-au-distributions
          path: dist/*
